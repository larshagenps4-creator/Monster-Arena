/* Compact arena: battle actions remain beside the player's monster. */
.battle-panel{padding:9px;margin-bottom:8px}
.battle-scene{min-height:0;height:clamp(330px,53vh,470px);padding:8px;display:flex;flex-direction:column;justify-content:space-between}

.fight-row .combatant{width:auto;flex:1;min-width:0}

.fight-controls .muted,.fight-controls .small{font-size:10px}

.element-modal{position:fixed;inset:0;z-index:1000;background:#050914dd;display:flex;align-items:center;justify-content:center;padding:16px}

.element-modal-card .grid{grid-template-columns:repeat(2,minmax(0,1fr))}

.element-open{position:absolute;left:4px;top:5px;z-index:6;background:#f4f5df;color:#243a2c;border-color:#829a69}

/* Version 7: klassische Statusfenster, Kampftext und klare Trefferanimationen */
.battle-scene{display:flex;flex-direction:column;justify-content:space-between;gap:8px;height:clamp(420px,62vh,540px);min-height:420px;padding:12px;background:linear-gradient(180deg,#b9e8f5 0%,#e8f4d7 42%,#83c56b 43%,#438e45 100%)}
.scene-top{height:36%;min-height:0;align-items:flex-start}
.scene-top .combatant{width:min(62%,340px);margin-left:auto}

.fight-row .combatant{width:min(62%,340px);flex:1}
.combatant{background:#f5f1cf!important;border:3px solid #536c45!important;border-radius:9px!important;padding:7px 9px!important;color:#243323!important;text-shadow:none!important;box-shadow:3px 4px 0 #294b3677}
.combatant .row b{font-size:13px;color:#1c2b20}
.combatant .tag{background:#e6e2b9;color:#243323;border:1px solid #7e875e}
.combatant .small{color:#344a35}
.combatant .bar{height:8px;background:#59604a;border:1px solid #35472f;margin:3px 0 5px}
.combatant .creature{font-size:clamp(58px,15vw,96px);line-height:1.05;filter:drop-shadow(0 5px 3px #0004)}
.enemy .creature{text-align:right}.player .creature{text-align:left}
.combatant .exp-line{display:flex;align-items:center;gap:5px;font-size:9px;color:#344a35;margin-top:2px}
.exp-track{height:5px;flex:1;background:#9da68a;border:1px solid #6d795d;border-radius:5px;overflow:hidden}.exp-track span{display:block;height:100%;background:#48a9e8}
.battle-message{background:#16445a;color:#fff;border:4px solid #e5d69a;outline:2px solid #4c593b;border-radius:8px;padding:10px 12px;min-height:58px;font-weight:750;line-height:1.35;font-size:13px;box-shadow:0 3px 0 #263b2c;}
.battle-message small{display:block;color:#d5e9e7;font-weight:500;margin-top:3px}
.battle-menu,.menu-sub{background:#f5f1cf;border:3px solid #536c45;border-radius:9px;padding:8px;color:#243323}
.battle-menu button,.menu-sub button{min-height:42px}

function teamWipe(){S.enemy=null;S.losses++;S.stage=1;S.enemyLevel=1;S.team= S.team.filter(id=>S.owned.some(m=>m.id===id));S.active=S.team.find(id=>S.owned.find(m=>m.id===id)?.hp>0)||S.team[0]||S.owned[0]?.id;S.owned.forEach(m=>{m.hp=m.max;m.guard=false;m.slow=0;m.cooldown=0});logmsg('💀 Dein gesamtes Team wurde besiegt! Du kehrst auf Stufe 1 zurück. Alle Monster werden vollständig geheilt. Monster, Level, XP, Verbesserungen und Münzen bleiben erhalten. Beschwöre neue Monster und baue dein Team auf Stufe 1 neu auf!');save()}
function pickNext(){let n=teamMons().find(m=>m.hp>0);if(n){S.active=n.id;logmsg(`${n.name} springt automatisch ein!`);return true}teamWipe();return false}
function enemyTurn(){
 let e=S.enemy,p=active();if(!e||!p||busy)return;
 S.battleTurn='enemy';busy=true;menuMode='none';render();animateLunge('enemy');
 
 turnTimer=setTimeout(()=>{
  e=S.enemy;p=active();if(!e||!p){busy=false;render();return}
  let action='attack',roll=Math.random();if(e.cooldown===0&&(e.boss?roll<.42:roll<.22))action='special';else if(roll>.76)action='defend';
  let d=0,msg='',lines=[];
  if(action==='defend'){e.guard=true;if(e.cooldown>0)e.cooldown=Math.max(0,e.cooldown-1);lines.push(`${e.name} nimmt eine defensive Haltung ein.`)}
  else{let base=e.atk*(e.slow>0?.65:1);if(e.slow>0)e.slow--;if(p.guard)base*=.3;[d,msg]=hit(e,p,base);if(action==='special'){e.cooldown=4;if(e.element==='Eis'){p.slow=2;lines.push(`${e.name} setzt ${e.special} ein!`)}else if(e.element==='Schatten'){let heal=Math.min(e.max-e.hp,Math.round(d*.4));e.hp+=heal;lines.push(`${e.name} setzt ${e.special} ein und heilt sich um ${heal} LP.`)}else{d=Math.round(d*1.25);lines.push(`${e.name} setzt ${e.special} ein!`)}}else lines.push(`${e.name} greift an!`);p.hp=Math.max(0,p.hp-d);animateHitAfterImpact('player');p.guard=false;lines.push(`${p.name} verliert ${d} HP.`);if(action!=='special'&&e.cooldown>0)e.cooldown=Math.max(0,e.cooldown-1)}
  logmsg(lines.join(' '));
  if(p.hp<=0){lines.push(`${p.name} ist kampfunfähig!`);let ok=pickNext();if(!ok){busy=false;render();return}lines.push(`${active().name} kommt in den Kampf!`)}
  S.battleTurn='player';playMessages([...lines,'Was möchtest du tun?'],()=>{if(!active()||active().hp<=0)return;menuMode='root';render()});
 },900);
}

function animateLunge(side){
 const id=side==='player'?'playerSprite':'enemySprite';
 const node=document.getElementById(id);if(!node)return;
 const cls=side==='player'?'lunge-player':'lunge-enemy';
 node.classList.remove(cls);void node.offsetWidth;node.classList.add(cls);
 setTimeout(()=>node.classList.remove(cls),950);
}
function animateHitAfterImpact(side){
 const id=side==='player'?'playerSprite':'enemySprite';
 const apply=()=>{
  const node=document.getElementById(id);if(!node)return;
  node.classList.remove('hit-after-impact');void node.offsetWidth;
  node.classList.add('hit-after-impact');
  setTimeout(()=>node.classList.remove('hit-after-impact'),520);
 };
 setTimeout(apply,40);
}
function showImpact(txt,kind=''){let sc=$('.battle-scene');if(!sc)return;let el=document.createElement('div');el.className='impact '+kind;el.textContent=txt;sc.appendChild(el);setTimeout(()=>el.remove(),750)}
function playerAct(k,id){
 if(busy||!S.enemy||S.battleTurn!=='player')return;let p=active(),e=S.enemy;if(!p||!e||p.hp<=0)return;
 if(k==='switch'){let n=S.owned.find(m=>m.id===id);if(!S.team.includes(id)||!n||n.hp<=0||id===p.id)return;if(p.cooldown>0)p.cooldown=Math.max(0,p.cooldown-1);S.active=id;logmsg(`Du wechselst zu ${n.name}.`);playMessages([`Du wechselst zu ${n.name}.`,`${e.name} ist am Zug!`],()=>enemyTurn());return}
 if(k==='special'&&p.cooldown>0)return alert(`Spezialfähigkeit noch ${p.cooldown} eigene Runde(n) Abklingzeit.`);
 busy=true;menuMode='none';S.battleTurn='animating';render();animateLunge('player');
 turnTimer=setTimeout(()=>{p=active();e=S.enemy;if(!p||!e){busy=false;render();return}let d=0,msg='',lines=[];
 if(k==='defend'){p.guard=true;p.cooldown=Math.max(0,p.cooldown-3);lines.push(`${p.name} geht in Abwehrhaltung.`)}
 else{let base=p.atk*(p.slow>0?.65:1);if(p.slow>0)p.slow--;if(k==='special'){base=p.atk*1.45*(p.slow>0?.65:1);p.cooldown=4;if(p.element==='Eis'){e.slow=2;lines.push(`${p.name} setzt ${p.special} ein!`)}else if(p.element==='Schatten')lines.push(`${p.name} setzt ${p.special} ein!`);else lines.push(`${p.name} setzt ${p.special} ein!`)}else lines.push(`${p.name} greift an!`);[d,msg]=hit(p,e,base);if(e.guard){d=Math.max(1,Math.round(d*.3));e.guard=false}e.hp=Math.max(0,e.hp-d);lines.push(`${e.name} verliert ${d} HP.`);if(k==='special'&&p.element==='Schatten'){let heal=Math.min(p.max-p.hp,Math.round(d*.55));p.hp+=heal;if(heal)lines.push(`${p.name} heilt sich um ${heal} LP.`)}if(k==='special'&&p.element==='Blitz')e.guard=false;if(k!=='special'&&p.cooldown>0)p.cooldown=Math.max(0,p.cooldown-1)}
 logmsg(lines.join(' '));render();if(k!=='defend')animateHitAfterImpact('enemy');
 playMessages(lines,()=>{if(e.hp<=0){busy=false;winBattle();render();return}enemyTurn()});
 },900);
}

function winBattle(){let e=S.enemy,p=active();S.wins++;let reward=180+S.stage*35+(e.boss?1200:0);S.coins+=reward;if(p){p.xp+=60+S.stage*10+(e.boss?150:0);level(p)}if(e.boss){S.bossDefeated++;logmsg(`👑 BOSS BESIEGT! Einmalige Boss-Belohnung: +1200 Bonusmünzen und ein Beschwörungsticket (Testbonus).`);S.tickets=(S.tickets||0)+1}logmsg(`🏆 Sieg! +${reward} Münzen. Stufe ${S.stage} abgeschlossen.`);S.enemy=null;S.stage++;S.enemyLevel=S.stage;S.owned.forEach(m=>{m.guard=false;m.slow=0});S.battleTurn='player'}
function healAll(){if(!canPrepare())return alert('Während eines Kampfes kannst du nicht heilen.');let ms=teamMons().filter(m=>m.hp<m.max);if(!ms.length)return alert('Dein Team hat bereits volle Lebenspunkte.');if(S.coins<75)return alert('Du brauchst 75 Münzen.');S.coins-=75;ms.forEach(m=>{m.hp=m.max;m.slow=0;m.guard=false});logmsg('Dein gesamtes Team wurde für 75 Münzen geheilt.');render()}
function healTurn(kind){if(busy||!S.enemy||S.battleTurn!=='player')return;let p=active(),targets=kind==='team'?teamMons():[p],cost=kind==='team'?75:20;if(!p||targets.every(m=>m.hp>=m.max))return alert('Diese Monster haben bereits volle Lebenspunkte.');if(S.coins<cost)return alert(`Du brauchst ${cost} Münzen.`);S.coins-=cost;targets.forEach(m=>{m.hp=m.max;m.slow=0;m.guard=false});let line=kind==='team'?`Dein gesamtes Team wurde für ${cost} Münzen geheilt.`:`${p.name} wurde für ${cost} Münzen vollständig geheilt.`;logmsg(line);S.battleTurn='animating';playMessages([line,'Dein Zug entfällt. Der Gegner ist am Zug!'],()=>enemyTurn())}
function train(id,what){if(!canPrepare())return alert('Während eines Kampfes kannst du nicht trainieren.');let m=S.owned.find(x=>x.id===id),cost=what==='heal'?20:150+m.level*50;if(S.coins<cost)return alert('Nicht genug Münzen.');S.coins-=cost;if(what==='atk')m.atk+=4;if(what==='def')m.def+=3;if(what==='hp'){m.max+=12;m.hp+=12}if(what==='heal')m.hp=m.max;logmsg(`${m.name}: Training abgeschlossen.`);render()}
function setTeam(id){if(!canManage())return alert('Dein Team kannst du nur auf Stufe 1 ändern.');let idx=S.team.indexOf(id);if(idx>=0){if(S.team.length===1)return alert('Du brauchst mindestens ein Teammonster.');S.team=S.team.filter(x=>x!==id);if(S.active===id)S.active=teamMons().find(m=>m.hp>0)?.id||S.team[0];logmsg(`${S.owned.find(m=>m.id===id).name} aus dem aktiven Team genommen.`)}else{if(S.team.length>=5)return alert('Dein Team darf maximal 5 Monster haben.');let m=S.owned.find(x=>x.id===id);if(!m)return;S.team.push(id);if(!active()||active().hp<=0)S.active=id;logmsg(`${m.name} ins Team aufgenommen.`)}render()}
function setActive(id){if(!canManage())return alert('Monster kannst du nur auf Stufe 1 auswählen.');if(!S.team.includes(id))return alert('Nimm das Monster zuerst in dein Team auf.');let m=S.owned.find(x=>x.id===id);if(m&&m.hp>0){S.active=id;logmsg(`${m.name} ist dein Startmonster.`);render()}else alert('Dieses Monster muss erst geheilt werden.')}
function claim(id){let done={first:S.wins>=1,wins3:S.wins>=3,summon3:S.owned.length>=4,level5:S.owned.some(m=>m.level>=5),daily:S.daily!==new Date().toDateString()}[id];if(!done||S.claims.includes(id))return;let reward={first:250,wins3:400,summon3:250,level5:500,daily:150}[id];S.claims.push(id);if(id==='daily')S.daily=new Date().toDateString();S.coins+=reward;logmsg(`Aufgabe erledigt: +${reward} Münzen!`);render()}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function elementIcon(el){return ({Feuer:'🔥',Wasser:'💧',Pflanze:'🍃',Blitz:'⚡',Eis:'❄️',Schatten:'🌑',Drache:'🐉'})[el]||'✨'}
function battle(){
 let e=S.enemy,p=active(),busyNow=busy;
 if(!e){return `<div class="panel"><div class="row"><h2>🏟️ Arena · Stufe ${S.stage}</h2><span class="pill">🪙 ${S.coins}</span></div>${S.stage===1?'<div class="notice">Auf Stufe 1 kannst du dein Team ändern, Monster beschwören, trainieren und heilen. Ab Stufe 2 ist dein Team für den Durchlauf fest.</div>':''}${S.stage>1&&S.stage%10===0?`<div class="boss-banner">👑 BOSS HERAUSFORDERUNG – STUFE ${S.stage}</div>`:''}<div class="grid">${teamMons().map(m=>`<div class="monster ${m.id===S.active?'selection':''}"><div class="row"><b>${monsterArt(m,'mini-art')} ${m.name}</b><span class="tag">${m.id===S.active?'Aktiv':'Team'}</span></div><div class="muted small">Lv. ${m.level} · ${elementIcon(m.element)} ${m.element}</div>${bar(m)}</div>`).join('')}</div><div class="actions"><button class="primary" onclick="G.start()" ${!teamMons().some(m=>m.hp>0)?'disabled':''}>⚔️ Kampf auf Stufe ${S.stage} starten</button><button class="green" onclick="G.healAll()">💚 Team heilen · 75 🪙</button></div>${!teamMons().some(m=>m.hp>0)?'<div class="notice">Dein Team ist erschöpft.</div>':''}</div><div class="panel"><h2>📜 Kampfverlauf</h2><div class="log">${S.log.map(x=>'<div>› '+esc(x)+'</div>').join('')}</div></div>`}
 if(!p)return '<div class="panel">Kein kampffähiges Monster im Team.</div>';
 let controls='';
 if(menuMode==='root') controls=`<div class="battle-menu root-actions"><button class="red" onclick="G.menu('fight')" ${busyNow?'disabled':''}>⚔️ KAMPF</button><button class="green" onclick="G.menu('heal')" ${busyNow?'disabled':''}>💚 HEILUNG</button></div>`;
 if(menuMode==='fight') controls=`<div class="menu-sub"><div class="row"><b>⚔️ Attacken</b><button onclick="G.menu('root')">↩ Zurück</button></div><div class="actions"><button class="red" onclick="G.act('attack')" ${busyNow?'disabled':''}>Angriff<br><small>${hit(p,e)[0]} Schaden</small></button><button class="primary" onclick="G.act('special')" ${busyNow||p.cooldown>0?'disabled':''}>Spezial<br><small>${p.cooldown?`Noch ${p.cooldown}`:esc(p.special)}</small></button><button class="cyan" onclick="G.act('defend')" ${busyNow?'disabled':''}>Abwehr<br><small>70% Schutz</small></button></div></div>`;
 if(menuMode==='heal') controls=`<div class="menu-sub"><div class="row"><b>💚 Heilung</b><button onclick="G.menu('root')">↩ Zurück</button></div><div class="actions"><button class="green" onclick="G.healTurn('single')" ${busyNow||S.coins<20||p.hp>=p.max?'disabled':''}>Dieses Monster heilen<br><small>20 🪙 · Zug verbraucht</small></button><button class="green" onclick="G.healTurn('team')" ${busyNow||S.coins<75||teamMons().every(m=>m.hp>=m.max)?'disabled':''}>Ganzes Team heilen<br><small>75 🪙 · Zug verbraucht</small></button></div><div class="muted small">Nach der Heilung greift der Gegner einmal an.</div></div>`;
 let last=messageFull||S.log[0]||'Der Kampf beginnt!';
 return `<div class="panel battle-panel"><div class="row"><h2>🏟️ Arena · Stufe ${S.stage}</h2><span class="pill">${e.boss?'👑 BOSS':'Kampf'}</span></div>${e.boss?`<div class="boss-banner">👑 BOSS HERAUSFORDERUNG – STUFE ${S.stage}</div>`:''}
 <div class="battle-scene"><button class="element-open" onclick="G.toggleGuide()">📘 Elemente</button>
 <div class="scene-top"><div class="combatant enemy" id="enemyCard"><div class="row"><b>${esc(e.name)}</b><span class="tag">${elementIcon(e.element)} Lv. ${e.level}</span></div>${combatBar(e)}</div><div class="battle-sprite enemy-sprite" id="enemySprite">${battleMonsterArt(e)}</div></div>
 <div class="fight-row"><div class="battle-sprite player-sprite" id="playerSprite">${battleMonsterArt(p)}</div><div class="combatant player" id="playerCard"><div class="row"><b>${esc(p.name)}</b><span class="tag">${elementIcon(p.element)} Lv. ${p.level}</span></div>${combatBar(p)}${expBar(p)}</div></div></div>
 <div class="battle-console"><div class="battle-message ${busyNow?'waiting':''}" aria-live="polite"><span class="battle-message-text" onclick="G.advance()">${esc(last)}</span><small class="message-hint" onclick="G.advance()">${busyNow?'Text wird angezeigt …':''}</small>${controls}</div></div>
 <div class="battle-team-switch"><h3>Teamwechsel (verbraucht deinen Zug)</h3><div class="actions">${teamMons().filter(m=>m.id!==p.id&&m.hp>0).map(m=>`<button onclick="G.act('switch',${m.id})" ${busyNow?'disabled':''}>${m.emoji} ${m.name} · ${m.hp} LP</button>`).join('')||'<span class="muted">Keine anderen kampffähigen Teammonster.</span>'}</div></div></div>`;
}
function teamPage(){let allowed=canManage();return `<div class="panel"><div class="row"><h2>🛡️ Aktives Team (${S.team.length}/5)</h2><span class="tag">${allowed?'Team bearbeiten erlaubt':'Nur auf Stufe 1 änderbar'}</span></div><div class="notice">Wähle bis zu fünf Monster. Alle anderen bleiben in deiner Sammlung. Teamzusammenstellung ist ausschließlich auf Stufe 1 möglich – auch nach Bosskämpfen nicht.</div><div class="grid">${S.owned.map(m=>{let inTeam=S.team.includes(m.id);return card(m,`<div class="actions"><button onclick="G.setTeam(${m.id})" ${!allowed||(!inTeam&&S.team.length>=5)?'disabled':''}>${inTeam?'Aus Team nehmen':'Ins Team nehmen'}</button><button onclick="G.setActive(${m.id})" ${!allowed||!inTeam||m.id===S.active||m.hp<=0?'disabled':''}>${m.id===S.active?'Startmonster':'Als Startmonster'}</button></div>`)}).join('')}</div><p class="muted small">Aktiv = dein Startmonster. Fällt es im Kampf aus, springt automatisch das nächste kampffähige Teammonster ein.</p></div>`}
function summonPage(){let allowed=canManage();return `<div class="panel"><h2>🥚 Beschwörungen</h2>${!allowed?'<div class="notice">Beschwören ist nur auf Stufe 1 möglich.</div>':''}<p class="muted">Neue Monster landen in deiner Sammlung. Das normale Ei enthält die drei gewöhnlichen und vier seltenen Anfangsmonster.</p><div class="grid"><div class="monster"><h3>🥚 Normales Ei</h3><p class="muted small">90 % gewöhnlich (je 30 % pro Monster) · 10 % selten (je 2,5 % pro Monster)</p><div class="row"><b>🪙 500</b><button class="primary" onclick="G.summon('normal')" ${!allowed||S.coins<500?'disabled':''}>Beschwören</button></div></div><div class="monster"><h3>🌟 Legendär-Ei</h3><p class="muted small">Nur die sieben eigenständigen legendären Monster. 5 % Chance auf ein legendäres Monster pro Ei.</p><div class="row"><b>🪙 5.000</b><button class="gold" onclick="G.summon('legendary')" ${!allowed||S.coins<5000?'disabled':''}>Legendär-Ei öffnen</button></div></div></div></div>`}
function collection(){return `<div class="panel"><h2>🐾 Monstersammlung (${S.owned.length})</h2><p class="muted">Hier bleiben alle deine Monster erhalten, auch wenn sie nicht im aktiven Team sind.</p><div class="grid">${S.owned.map(m=>card(m,`<div class="actions"><button onclick="G.details(${m.id})">Details</button><span class="tag">${S.team.includes(m.id)?'Im Team':'Sammlung'}</span></div>`)).join('')}</div></div>`}

 document.body.appendChild(wrap);
}

function monsterDex(){
 const elements=['Alle','Pflanze','Feuer','Wasser','Blitz','Eis','Schatten','Drache'];
 const rarities=['Alle','Common','Rare','Legendary'];
 const filtered=book.map((t,i)=>({t,i})).filter(({t})=>(dexElement==='Alle'||t[2]===dexElement)&&(dexRarity==='Alle'||t[3]===dexRarity));
 const selected=book[dexSelected]||book[0];
 const elButtons=elements.map(e=>`<button class="${dexElement===e?'active':''}" onclick="G.dexElement('${e}')">${e==='Alle'?'Alle':({'Pflanze':'🍃','Feuer':'🔥','Wasser':'💧','Blitz':'⚡','Eis':'❄️','Schatten':'🌑','Drache':'🐉'}[e]+' '+e)}</button>`).join('');
 const rarButtons=rarities.map(r=>`<button class="${dexRarity===r?'active':''}" onclick="G.dexRarity('${r}')">${r}</button>`).join('');
 const tiles=filtered.map(({t,i})=>`<button class="dex-tile ${dexSelected===i?'selection':''}" onclick="G.dexSelect(${i})"><img src="${artFor({name:t[0],element:t[2],rarity:t[3]})}" alt="${t[0]}" loading="lazy"><b>${t[0]}</b><span class="rarity ${t[3]}">${t[3]}</span><small>${t[2]}</small></button>`).join('');
 return `<section class="panel"><div class="row"><h2>📖 Monsterdex</h2><span class="pill">${book.length}/14 Monster · 7 Elemente</span></div><p class="muted small">Entdecke alle Monster der Arena – unabhängig davon, ob du sie bereits besitzt.</p><div class="dex-filters">${elButtons}</div><div class="dex-filters rarity-filters">${rarButtons}</div><div class="dex-layout"><div class="dex-grid">${tiles}</div><aside class="dex-detail"><img src="${artFor({name:selected[0],element:selected[2],rarity:selected[3]})}" alt="${selected[0]}"><h3>${selected[0]}</h3><div class="rarity ${selected[3]}">${selected[3]}</div><div class="pill">${selected[1]} ${selected[2]}</div><div class="stats"><span class="pill">❤️ ${selected[4]} LP</span><span class="pill">⚔️ ${selected[5]}</span><span class="pill">🛡️ ${selected[6]}</span></div><div class="notice"><b>Spezialfähigkeit</b><br>${selected[7]}</div><p class="muted small">Das Monster ist im Monsterdex sichtbar. Beschwöre es, um es deiner Sammlung hinzuzufügen.</p></aside></div></section>`;
}

let arenaColorCache=null, arenaColorBusy=false;
const ARENA_ELEMENT_HUES={Feuer:4,Wasser:220,Pflanze:112,Blitz:48,Eis:190,Schatten:275,Drache:174};
function rgbToHslHue(r,g,b){let mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return (h*60+360)%360}
function hueRgb(h,s,v){
 // Einheitliche, kräftige HSL-Farbgebung: Die Helligkeitsstruktur des Originalrings
 // bleibt erhalten, die Sättigung wird aber für alle Elemente auf ein vergleichbares
 // Niveau angehoben. So wirkt insbesondere Wasser nicht mehr blass gegenüber Pflanze.
 const H=((h%360)+360)%360/360;
 const L=Math.max(.28,Math.min(.68,.25+.38*Math.sqrt(Math.max(0,Math.min(1,v)))));
 const S=.99;
 const C=(1-Math.abs(2*L-1))*S;
 const X=C*(1-Math.abs((H*6)%2-1));
 const m=L-C/2;
 let r=0,g=0,b=0;
 if(H<1/6){r=C;g=X}else if(H<2/6){r=X;g=C}else if(H<3/6){g=C;b=X}else if(H<4/6){g=X;b=C}else if(H<5/6){r=X;b=C}else{r=C;b=X}
 return [r+m,g+m,b+m];
}
function updateArenaRingColors(){
 const scene=document.querySelector('.battle-scene');if(!scene||!S.enemy)return;
 const player=active(),enemy=S.enemy;if(!player||!enemy)return;
 const ph=ARENA_ELEMENT_HUES[player.element]??112,eh=ARENA_ELEMENT_HUES[enemy.element]??112;
 const key=ph+'_'+eh;
 if(arenaColorCache&&arenaColorCache.key===key){scene.style.setProperty('background-image',`url("${arenaColorCache.url}")`,'important');return}
 if(arenaColorBusy)return;arenaColorBusy=true;
 Promise.all(['assets/arena-background-v14.png','assets/ring-mask-player.png','assets/ring-mask-enemy.png'].map(src=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src}))).then(([bg,pm,em])=>{
  const c=document.createElement('canvas');c.width=bg.naturalWidth;c.height=bg.naturalHeight;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(bg,0,0);let data=ctx.getImageData(0,0,c.width,c.height),p=data.data;
  function apply(maskImg,targetHue){const mc=document.createElement('canvas');mc.width=c.width;mc.height=c.height;const mctx=mc.getContext('2d',{willReadFrequently:true});mctx.drawImage(maskImg,0,0,c.width,c.height);const a=mctx.getImageData(0,0,c.width,c.height).data;
   for(let i=0;i<p.length;i+=4){let alpha=a[i]/255;if(alpha<.025)continue;let r=p[i]/255,g=p[i+1]/255,b=p[i+2]/255;let mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx===0?0:(mx-mn)/mx;if(sat<.04)continue;let rgb=hueRgb(targetHue,sat,mx);p[i]=Math.round((r*(1-alpha)+rgb[0]*alpha)*255);p[i+1]=Math.round((g*(1-alpha)+rgb[1]*alpha)*255);p[i+2]=Math.round((b*(1-alpha)+rgb[2]*alpha)*255)}
  }
  apply(pm,ph);apply(em,eh);ctx.putImageData(data,0,0);const url=c.toDataURL('image/webp',.94);arenaColorCache={key,url};scene.style.setProperty('background-image',`url("${url}")`,'important');
 }).catch(err=>console.warn('Arena-Ringfarben konnten nicht geladen werden',err)).finally(()=>{arenaColorBusy=false;updateArenaRingColors()});
}
function render(){$('#coins').textContent=S.coins.toLocaleString('de-DE');let pages={battle,team:teamPage,summon:summonPage,collection,dex:monsterDex,guide,training,quests};$('#view').innerHTML=pages[tab]();updateArenaRingColors();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));save()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(busy)return;tab=b.dataset.tab;render()});
window.G={toggleGuide,dexElement(v){dexElement=v;render()},dexRarity(v){dexRarity=v;render()},dexSelect(i){dexSelected=i;render()},advance:advanceMessage,menu(m){if(busy)return;menuMode=m;render()},healTurn,start,summon,summonTicket,act:playerAct,healAll,train,claim,setTeam,setActive,details(id){let m=S.owned.find(x=>x.id===id);alert(`${m.name}\nSeltenheit: ${m.rarity}\nElement: ${m.element}\nLevel: ${m.level}\nLP: ${m.hp}/${m.max}\nAngriff: ${m.atk}\nVerteidigung: ${m.def}\nSpezial: ${m.special}`)},reset(){if(confirm('Spielstand dieser Testversion löschen?')){localStorage.removeItem('monsterArenaSaveV3');location.reload()}}};
load();render();
</script>
