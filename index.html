function summon(type){if(!canManage())return alert('Beschwörungen sind nur auf Stufe 1 möglich.');if(S.coins<prices[type])return alert('Nicht genug Münzen.');S.coins-=prices[type];let rar=weighted(type==='legendary'?'legendary':'normal'),pool=book.filter(t=>t[3]===rar),m=make(pool[Math.floor(Math.random()*pool.length)]);S.owned.push(m);logmsg(`🥚 ${m.name} (${m.rarity}) wurde beschworen und ist jetzt in deiner Sammlung.`);render()}

function mult(x,y){if(({Feuer:'Pflanze',Pflanze:'Wasser',Wasser:'Feuer'})[x.element]===y.element)return[1.2,'Elementvorteil +20%!'];if(x.element==='Blitz'&&y.element==='Wasser')return[1.1,'Blitzvorteil +10%!'];return[1,'']}

function enemyMake(){
 let boss=isBoss(), pool;
 if(boss){
   if(S.stage>=50) pool=book.filter(t=>t[3]==='Legendary');
   else pool=book.filter(t=>t[3]==='Rare');

 else if(S.stage<50){pool=book.filter(t=>t[3]==='Rare')}
 else {pool=book.filter(t=>t[3]==='Rare')}
 let t=pool[Math.floor(Math.random()*pool.length)];
 let lv=Math.max(1,Math.floor(S.stage*.55));let e=make(t,lv);
 if(!boss){const scale=S.stage<=3?0.62:S.stage<=6?0.76:S.stage<=9?0.9:1;e.max=Math.max(1,Math.round(e.max*scale));e.hp=e.max;e.atk=Math.max(1,Math.round(e.atk*scale));e.def=Math.max(0,Math.round(e.def*scale));}

 if(boss){e.name=t[0];e.max=Math.round(e.max*(S.stage>=50?2.0:1.65));e.hp=e.max;e.atk=Math.round(e.atk*(S.stage>=50?1.65:1.3));e.def=Math.round(e.def*1.25);e.special=t[7]}
 return e
}
function start(){if(busy||S.enemy)return;S.lastVictory=null;menuMode='none';if(S.stage===1&&!S.team.length)return alert('Wähle zuerst dein Team.');let p=active();if(!p||p.hp<=0){let living=teamMons().find(m=>m.hp>0);if(!living)return teamWipe();S.active=living.id;p=living}S.enemy=enemyMake();S.battleTurn='player';S.enemyCooldown=0;let intro=S.enemy.boss?`Ein Boss erscheint: ${S.enemy.name}!`:`Ein wildes ${S.enemy.name} erscheint!`;logmsg(intro);playMessages([intro,'Was möchtest du tun?'],()=>{menuMode='root';render()})}

function teamWipe(){if(testMode){logmsg('Testkampf verloren. Du kannst eine neue Runde starten.');restoreFromTest();render();return}S.enemy=null;S.losses++;S.stage=1;S.enemyLevel=1;S.team= S.team.filter(id=>S.owned.some(m=>m.id===id));S.active=S.team.find(id=>S.owned.find(m=>m.id===id)?.hp>0)||S.team[0]||S.owned[0]?.id;S.owned.forEach(m=>{m.hp=m.max;m.guard=false;m.slow=0;m.cooldown=0});logmsg('💀 Dein gesamtes Team wurde besiegt! Du kehrst auf Stufe 1 zurück. Alle Monster werden vollständig geheilt. Monster, Level, XP, Verbesserungen und Münzen bleiben erhalten. Beschwöre neue Monster und baue dein Team auf Stufe 1 neu auf!');save()}
function pickNext(){let n=teamMons().find(m=>m.hp>0);if(n){S.active=n.id;logmsg(`${n.name} springt automatisch ein!`);return true}teamWipe();return false}
function enemyTurn(){
 let e=S.enemy,p=active();if(!e||!p||busy)return;
 if(e.skipTurn>0){e.skipTurn--;S.battleTurn='player';const skipped=`${e.name} ist eingefroren und setzt seinen Zug aus!`;logmsg(skipped);playMessages([skipped,'Was möchtest du tun?'],()=>{menuMode='root';render()});return}
 S.battleTurn='enemy';busy=true;menuMode='none';let action='attack',roll=Math.random();if(e.cooldown===0&&(e.boss?roll<.42:roll<.22))action='special';else if(roll>.76)action='defend';render();if(action==='special')playSpecialEffect(e.element,!!e.boss,'enemy');else if(action==='attack')animateLunge('enemy');

  e=S.enemy;p=active();if(!e||!p){busy=false;render();return}

function playSpecialEffect(element,isBoss,side){
 const target=document.getElementById(side==='player'?'enemySprite':'playerSprite');
 const attacker=document.getElementById(side==='player'?'playerSprite':'enemySprite');
 if(!target||!attacker)return;
 const palette={
  Pflanze:{name:'Pflanzenstrahl',color:'#72ff55'},
  Feuer:{name:'Feuerstrahl',color:'#ff572b'},
  Wasser:{name:'Wasserstrahl',color:'#31c9ff'},
  Blitz:{name:'Blitzstrahl',color:'#fff044'},
  Eis:{name:'Eisstrahl',color:'#91efff'},
  Schatten:{name:'Schattenstrahl',color:'#bd62ff'},
  Drache:{name:'Drachenstrahl',color:'#ff9a35'}
 };
 const data=palette[element]||palette.Pflanze;
 const a=attacker.getBoundingClientRect(),t=target.getBoundingClientRect();
 const sx=a.left+a.width*.5,sy=a.top+a.height*.48;
 const ex=t.left+t.width*.5,ey=t.top+t.height*.48;
 const dx=ex-sx,bend=Math.max(-28,Math.min(28,dx*.035));
 const d=`M ${sx} ${sy} Q ${(sx+ex)/2+bend} ${(sy+ey)/2-12} ${ex} ${ey}`;
 const ns='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(ns,'svg');
 svg.setAttribute('viewBox',`0 0 ${Math.max(innerWidth,1)} ${Math.max(innerHeight,1)}`);
 Object.assign(svg.style,{position:'fixed',inset:'0',width:'100vw',height:'100vh',zIndex:'2147483000',pointerEvents:'none',overflow:'visible'});
 svg.setAttribute('aria-hidden','true');
 const makePath=(width,opacity,blur)=>{
  const p=document.createElementNS(ns,'path');
  p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',data.color);
  p.setAttribute('stroke-width',String(width));p.setAttribute('stroke-linecap','round');
  p.style.opacity=String(opacity);
  if(blur)p.style.filter=`blur(${blur}px)`;
  svg.appendChild(p);return p;
 };
 // Broad, soft translucent beam with a gentle, constant pulse.
 const glow=makePath(isBoss?34:29,.25,13);
 const body=makePath(isBoss?21:17,.27,6);
 const core=makePath(isBoss?7:5,.24,1.5);
 document.body.appendChild(svg);
 const length=glow.getTotalLength();
 [glow,body,core].forEach(p=>{
  p.style.strokeDasharray=String(length);
  p.style.strokeDashoffset=String(length);
  p.style.setProperty('--beam-length',String(length));
  p.style.animation='element-beam-grow 1.35s linear forwards';
 });
 // A brief soft flash and expanding ring appear only when the beam reaches the target.
 const flash=document.createElementNS(ns,'circle');
 flash.setAttribute('cx',String(ex));flash.setAttribute('cy',String(ey));
 flash.setAttribute('r',isBoss?'25':'19');flash.setAttribute('fill',data.color);
 flash.style.opacity='0';flash.style.filter=`blur(8px) drop-shadow(0 0 14px ${data.color})`;
 const ring=document.createElementNS(ns,'circle');
 ring.setAttribute('cx',String(ex));ring.setAttribute('cy',String(ey));
 ring.setAttribute('r','8');ring.setAttribute('fill','none');ring.setAttribute('stroke',data.color);
 ring.setAttribute('stroke-width',isBoss?'5':'3');ring.style.opacity='0';
 svg.appendChild(flash);svg.appendChild(ring);
 setTimeout(()=>{
  flash.style.animation='element-impact-flash .38s ease-out forwards';
  ring.style.animation='element-impact-ring .42s ease-out forwards';
 },1350);
 setTimeout(()=>svg.remove(),1900);
}

function playerAct(k,id){

 if(k==='switch'){let n=S.owned.find(m=>m.id===id);if(!S.team.includes(id)||!n||n.hp<=0||id===p.id)return;if(p.cooldown>0)p.cooldown=Math.max(0,p.cooldown-1);S.active=id;logmsg(`Du wechselst zu ${n.name}.`);playMessages([`Du wechselst zu ${n.name}.`,`${e.name} ist am Zug!`],()=>enemyTurn());return}

 turnTimer=setTimeout(()=>{p=active();e=S.enemy;if(!p||!e){busy=false;render();return}let d=0,msg='',lines=[];
 if(k==='defend'){p.guard=true;p.cooldown=Math.max(0,p.cooldown-3);lines.push(`${p.name} geht in Abwehrhaltung.`)}
 else{let base=p.atk*(p.slow>0?.65:1);if(p.slow>0)p.slow--;if(k==='special'){base=p.atk*1.45*(p.slow>0?.65:1);p.cooldown=4;if(p.element==='Eis'){e.skipTurn=1;lines.push(`${p.name} setzt ${p.special} ein! ${e.name} wird eingefroren und setzt seinen nächsten Zug aus!`)}else if(p.element==='Schatten')lines.push(`${p.name} setzt ${p.special} ein!`);else lines.push(`${p.name} setzt ${p.special} ein!`)}else lines.push(`${p.name} greift an!`);[d,msg]=hit(p,e,base);if(e.guard){d=Math.max(1,Math.round(d*.3));e.guard=false}e.hp=Math.max(0,e.hp-d);lines.push(`${e.name} verliert ${d} HP.`);if(k==='special'&&p.element==='Schatten'){let heal=Math.min(p.max-p.hp,Math.round(d*.55));p.hp+=heal;if(heal)lines.push(`${p.name} heilt sich um ${heal} LP.`)}if(k==='special'&&p.element==='Blitz')e.guard=false;if(k!=='special'&&p.cooldown>0)p.cooldown=Math.max(0,p.cooldown-1)}

function train(id,what){if(!canPrepare())return alert('Während eines Kampfes kannst du nicht trainieren.');let m=S.owned.find(x=>x.id===id),cost=what==='heal'?20:150+m.level*50;if(S.coins<cost)return alert('Nicht genug Münzen.');S.coins-=cost;if(what==='atk')m.atk+=4;if(what==='def')m.def+=3;if(what==='hp'){m.max+=12;m.hp+=12}if(what==='heal')m.hp=m.max;logmsg(`${m.name}: Training abgeschlossen.`);render()}

function centerVisibleBattleMonsters(){
 const scene=document.querySelector('.battle-scene');
 if(!scene)return;
 scene.querySelectorAll('.battle-art').forEach(img=>{
  const align=()=>{
   if(!img.naturalWidth||!img.naturalHeight)return;
   try{
    const canvas=document.createElement('canvas');
    canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(img,0,0);
    const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let minX=canvas.width,minY=canvas.height,maxX=-1,maxY=-1;
    for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++){
     if(pixels[(y*canvas.width+x)*4+3]>40){
      minX=Math.min(minX,x);maxX=Math.max(maxX,x);
      minY=Math.min(minY,y);maxY=Math.max(maxY,y);
     }
    }
    if(maxX<minX||maxY<minY)return;
    const w=img.clientWidth,h=img.clientHeight;
    if(!w||!h)return;
    const fit=Math.min(w/img.naturalWidth,h/img.naturalHeight);
    const ox=(w-img.naturalWidth*fit)/2,oy=(h-img.naturalHeight*fit)/2;
    const visibleHeight=(maxY-minY+1)*fit;
    const visibleWidth=(maxX-minX+1)*fit;
    // Keep exactly the 20.51 size limits. Only the horizontal anchor changes:
    // use the alpha-weighted torso center rather than the whole image bounds.
    const rarity=book.find(t=>t[0]===img.alt)?.[3]||'Common';
    const legendary=rarity==='Legendary';
    const targetHeight=Math.min(scene.clientHeight*(legendary?.36:.20),legendary?170:105);
    const targetWidth=scene.clientWidth*(legendary?.40:.215);
    const scale=Math.max(.65,Math.min(2.4,targetHeight/Math.max(1,visibleHeight),targetWidth/Math.max(1,visibleWidth)));
    const silhouetteHeight=maxY-minY+1;
    const bodyTop=minY+silhouetteHeight*.22;
    const bodyBottom=minY+silhouetteHeight*.86;
    let weightedX=0,totalWeight=0;
    for(let y=Math.floor(bodyTop);y<=Math.ceil(bodyBottom);y++){
     for(let x=minX;x<=maxX;x++){
      const alpha=pixels[(y*canvas.width+x)*4+3];
      if(alpha>40){const weight=alpha/255;weightedX+=x*weight;totalWeight+=weight;}
     }
    }
    if(!totalWeight)return;
    const bodyCenterX=ox+(weightedX/totalWeight)*fit;
    const scaledBodyCenterX=w/2+(bodyCenterX-w/2)*scale;
    const dx=w/2-scaledBodyCenterX;
    const visibleBottomY=oy+(maxY+1)*fit;
    const dy=(h-visibleBottomY)*scale;
    img.style.setProperty('transform-origin','center bottom','important');
    img.style.removeProperty('translate');img.style.removeProperty('scale');
    img.style.setProperty('transform',`translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${scale.toFixed(4)})`,'important');
    img.dataset.opticalCenterOffset=(bodyCenterX-w/2).toFixed(3);

<script id="arena-optical-centering-runtime-v2054">
/* Calculate each sprite's horizontal visual center from its real transparent PNG alpha.
   This only shifts the artwork inside its existing sprite box; ring and box coordinates stay unchanged. */
(function(){
  const done = new WeakSet();
  function centerArtwork(img){
    if(!img || done.has(img)) return;
    const measure = () => {
      if(done.has(img) || !img.naturalWidth || !img.naturalHeight) return;
      done.add(img);
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d', {willReadFrequently:true});
        if(!ctx) return;
        ctx.drawImage(img, 0, 0);
        const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let weightedX = 0, totalAlpha = 0;
        for(let y = 0; y < canvas.height; y += 2){
          for(let x = 0; x < canvas.width; x += 2){
            const alpha = pixels[(y * canvas.width + x) * 4 + 3];
            if(alpha > 32){ weightedX += x * alpha; totalAlpha += alpha; }
          }
        }
        if(!totalAlpha) return;
        const centerX = weightedX / totalAlpha;
        const correction = Math.max(-0.07, Math.min(0.07, 0.5 - centerX / canvas.width));
        img.style.setProperty('--arena-optical-x', (correction * 100).toFixed(3) + '%');
      } catch(error) {
        /* If canvas measurement is unavailable, keep the original centered image. */
      }
    };
    if(img.complete) measure();
    else img.addEventListener('load', measure, {once:true});
  }
  function scan(root){
    if(root && root.matches && root.matches('.battle-scene .battle-art')) centerArtwork(root);
    if(root && root.querySelectorAll) root.querySelectorAll('.battle-scene .battle-art').forEach(centerArtwork);
  }
  scan(document);
  const observer = new MutationObserver(records => {
    for(const record of records) for(const node of record.addedNodes) if(node.nodeType === 1) scan(node);
  });
  observer.observe(document.documentElement, {childList:true, subtree:true});
})();
</script>
