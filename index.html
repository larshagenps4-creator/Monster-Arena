function bar(m){return `<div class="row small"><span>❤️ LP</span><b>${Math.max(0,m.hp)}/${m.max}</b></div><div class="bar hp"><span style="width:${Math.max(0,Math.min(100,m.hp/m.max*100))}%"></span></div>`}

function summon(type){if(!canManage())return alert('Beschwörungen sind nur auf Stufe 1 möglich.');if(S.coins<prices[type])return alert('Nicht genug Münzen.');S.coins-=prices[type];let rar=weighted(type==='legendary'?'legendary':'normal'),pool=book.filter(t=>t[3]===rar),m=make(pool[Math.floor(Math.random()*pool.length)]);S.owned.push(m);logmsg(`🥚 ${m.name} (${m.rarity}) wurde beschworen und ist jetzt in deiner Sammlung.`);render()}
function summonTicket(){if(!canManage())return alert('Beschwörungen sind nur auf Stufe 1 möglich.');if(!(S.tickets>0))return alert('Du hast kein Boss-Beschwörungsticket.');S.tickets--;let rar='Legendary',pool=book.filter(t=>t[3]===rar),m=make(pool[Math.floor(Math.random()*pool.length)]);S.owned.push(m);logmsg(`🎟️ Boss-Ticket eingelöst: ${m.name} (${m.rarity}) wurde beschworen!`);render()}
function mult(x,y){if(({Feuer:'Pflanze',Pflanze:'Wasser',Wasser:'Feuer'})[x.element]===y.element)return[1.2,'Elementvorteil +20%!'];if(x.element==='Blitz'&&y.element==='Wasser')return[1.1,'Blitzvorteil +10%!'];return[1,'']}

 let boss=isBoss(), pool;

function start(){if(busy||S.enemy)return;S.lastVictory=null;menuMode='none';if(S.stage===1&&!S.team.length)return alert('Wähle zuerst dein Team.');let p=active();if(!p||p.hp<=0){let living=teamMons().find(m=>m.hp>0);if(!living)return teamWipe();S.active=living.id;p=living}S.enemy=enemyMake();S.battleTurn='player';S.enemyCooldown=0;let intro=S.enemy.boss?`Ein Boss erscheint: ${S.enemy.name}!`:`Ein wildes ${S.enemy.name} erscheint!`;logmsg(intro);playMessages([intro,'Was möchtest du tun?'],()=>{menuMode='root';render()})}

function pickNext(){let n=teamMons().find(m=>m.hp>0);if(n){S.active=n.id;logmsg(`${n.name} springt automatisch ein!`);return true}teamWipe();return false}
function enemyTurn(){

function playerAct(k,id){

 },900);

function rgbToHslHue(r,g,b){let mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return (h*60+360)%360}
function hueRgb(h,s,v){
 // Einheitliche, kräftige HSL-Farbgebung: Die Helligkeitsstruktur des Originalrings

 // Niveau angehoben. So wirkt insbesondere Wasser nicht mehr blass gegenüber Pflanze.

 const L=Math.max(.28,Math.min(.68,.25+.38*Math.sqrt(Math.max(0,Math.min(1,v)))));

 const C=(1-Math.abs(2*L-1))*S;
 const X=C*(1-Math.abs((H*6)%2-1));

   for(let i=0;i<p.length;i+=4){let alpha=a[i]/255;if(alpha<.025)continue;let r=p[i]/255,g=p[i+1]/255,b=p[i+2]/255;let mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx===0?0:(mx-mn)/mx;if(sat<.04)continue;let rgb=hueRgb(targetHue,sat,mx);p[i]=Math.round((r*(1-alpha)+rgb[0]*alpha)*255);p[i+1]=Math.round((g*(1-alpha)+rgb[1]*alpha)*255);p[i+2]=Math.round((b*(1-alpha)+rgb[2]*alpha)*255)}
  }

 }).catch(err=>console.warn('Arena-Ringfarben konnten nicht geladen werden',err)).finally(()=>{arenaColorBusy=false;updateArenaRingColors()});
}
